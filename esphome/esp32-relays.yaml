esphome:
  name: esp32-relays
  friendly_name: ESP32 Relays

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "ESP32-Relays Fallback"
    password: "fallback1234"

captive_portal:

web_server:
  port: 80
  version: 2

globals:
  - id: applied_level
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_ping
    type: uint32_t
    restore_value: no
    initial_value: "0"

switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin:
      number: GPIO27
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin:
      number: GPIO32
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 3"
    id: relay_3
    pin:
      number: GPIO25
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 4"
    id: relay_4
    pin:
      number: GPIO26
      inverted: true
    restore_mode: ALWAYS_OFF

script:
  - id: apply_fan
    mode: restart
    parameters:
      level: int
    then:
      - if:
          condition:
            lambda: "return level != id(applied_level);"
          then:
            - lambda: "id(applied_level) = level;"
            - switch.turn_off: relay_1
            - switch.turn_off: relay_2
            - switch.turn_off: relay_3
            - switch.turn_off: relay_4
            - if:
                condition:
                  lambda: "return level == 0;"
                then:
                  - switch.turn_on: relay_1
            - if:
                condition:
                  lambda: "return level == 1;"
                then:
                  - switch.turn_on: relay_2
            - if:
                condition:
                  lambda: "return level == 2;"
                then:
                  - switch.turn_on: relay_3
            - if:
                condition:
                  lambda: "return level == 3;"
                then:
                  - switch.turn_on: relay_4

button:
  - platform: template
    name: "Kickr Ping"
    id: kickr_ping
    on_press:
      - lambda: "id(last_ping) = millis();"

number:
  - platform: template
    name: "Fan Level"
    id: fan_level
    min_value: 0
    max_value: 3
    step: 1
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - lambda: "id(last_ping) = millis();"
      - script.execute:
          id: apply_fan
          level: !lambda "return (int) x;"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(applied_level) > 0 && id(last_ping) != 0 && (millis() - id(last_ping)) > 8000;"
          then:
            - script.execute:
                id: apply_fan
                level: 0
            - lambda: "id(fan_level).publish_state(0);"

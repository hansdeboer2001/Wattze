  <button id="btnConnect">Verbinden met Strava</button>

<div class="howto">
  <b>Hoe het werkt:</b><br>
  1. Klik "Verbinden met Strava" en geef toestemming (activity:write).<br>
  2. Kies een rit en klik "Upload".<br>
  3. De rit wordt als TCX geüpload (trainer-rit).
</div>

  connected = d.connected;
  const el = document.getElementById('status');
  if(connected){
    el.className = 'status ok';
    el.textContent = 'Verbonden met Strava' + (d.athlete ? ' als ' + d.athlete : '');
    document.getElementById('btnConnect').textContent = 'Opnieuw verbinden';

    el.className = 'status';
